name: Debug config (temp)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备"
        type: choice
        options:
          - ac42u
          - r619ac
        default: ac42u

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gcc g++ git python3 unzip zlib1g-dev libncurses5-dev gawk gettext jq

      - name: Clone ImmortalWrt source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt -b openwrt-25.12 immortalwrt

      - name: Add Passwall feeds
        working-directory: immortalwrt
        run: |
          echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git" >> feeds.conf.default
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" >> feeds.conf.default

      - name: Clone KuCat theme
        run: |
          cd immortalwrt/package
          git clone --depth=1 https://github.com/sirpdboy/luci-theme-kucat
          git clone --depth=1 https://github.com/sirpdboy/luci-app-kucat-config

      - name: Feeds update and install
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a >/dev/null 2>&1
          ./scripts/feeds install -a >/dev/null 2>&1
          echo "feeds 链接: $(ls package/feeds/ | tr '\n' ' ')"
          echo "jq 目录: $(ls -d package/feeds/packages/utils/jq 2>/dev/null || echo 缺失)"
          echo "luci-compat 目录: $(ls -d package/feeds/luci/collections/luci-compat 2>/dev/null || echo 缺失)"

      - name: A defconfig with config copied after feeds
        working-directory: immortalwrt
        run: |
          cp "$GITHUB_WORKSPACE/devices/${{ inputs.device }}/config" .config
          echo "复制后 CONFIG_PACKAGE_*=y 数量: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"
          make defconfig > /tmp/defconfig.log 2>&1 || true
          echo "defconfig 退出码: $?"
          echo "--- defconfig 输出末尾 40 行 ---"
          tail -40 /tmp/defconfig.log
          echo "--- 关键符号 ---"
          for s in jq luci-compat sing-box luci-app-passwall coreutils-timeout libjq luci-theme-kucat; do
            echo "  ${s}: $(grep -E "^(# )?CONFIG_PACKAGE_${s}(=y|=m| is not set)" .config | head -1)"
          done
          echo "defconfig 后 CONFIG_PACKAGE_*=y 数量: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"

      - name: B second defconfig pass
        working-directory: immortalwrt
        run: |
          make defconfig > /tmp/defconfig2.log 2>&1 || true
          echo "--- 第二次 defconfig 后关键符号 ---"
          for s in jq luci-compat sing-box luci-app-passwall; do
            echo "  ${s}: $(grep -E "^(# )?CONFIG_PACKAGE_${s}(=y|=m| is not set)" .config | head -1)"
          done
          echo "总数: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"
