name: Debug deps (temp)

on:
  workflow_dispatch:
    inputs:
      device:
        type: choice
        options: [ac42u, r619ac, n1]
        default: ac42u

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gcc g++ git python3 unzip zlib1g-dev libncurses5-dev gawk gettext

      - name: Prepare tree
        run: |
          git clone --quiet https://github.com/immortalwrt/immortalwrt -b openwrt-25.12 immortalwrt
          cd immortalwrt
          if [ "${{ inputs.device }}" = "n1" ]; then
            echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git" >> feeds.conf.default
            echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" >> feeds.conf.default
          else
            echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git" >> feeds.conf.default
            echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" >> feeds.conf.default
          fi
          cd package && git clone --quiet --depth=1 https://github.com/sirpdboy/luci-theme-kucat && git clone --quiet --depth=1 https://github.com/sirpdboy/luci-app-kucat-config
          cd ..
          ./scripts/feeds update -a > /dev/null 2>&1
          ./scripts/feeds install -a > /dev/null 2>&1
          cp "$GITHUB_WORKSPACE/devices/${{ inputs.device }}/config" .config
          make defconfig > /dev/null 2>&1
          echo "=== 关键包选择情况 ==="
          for p in sing-box shadowsocks-rust xray-core haproxy v2ray-plugin smartdns simple-obfs luci-app-passwall; do
            printf "  %-18s %s\n" "$p" "$(grep -E "^(# )?CONFIG_PACKAGE_${p}=" .config | head -1)"
          done
          echo "=== 引用 rust/host 的包，是否被选中 ==="
          for mk in $(grep -rl "rust/host" package/ feeds/ --include=Makefile 2>/dev/null); do
            name=$(awk -F':=' '/^PKG_NAME:=/{gsub(/ /,"",$2); print $2; exit}' "$mk")
            [ -z "$name" ] && continue
            sel=$(grep -qE "^CONFIG_PACKAGE_${name}=y" .config && echo "SELECTED" || echo "-")
            printf "  %-28s %s\n" "$name" "$sel"
          done
          echo "=== CONFIG_PACKAGE_*=y 总数 ==="
          grep -c '^CONFIG_PACKAGE_.*=y' .config
